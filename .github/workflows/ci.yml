# Every push and pull request: lint, tests on SQLite and PostgreSQL 16 (with the object-detection model fetched and
# checksum-verified; tests that need it fail rather than skip), dependency, secret and container-image scans, the web app
# (type check, ESLint, unit tests, production build, npm audit), and the Vercel image (built and smoke-tested).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install "ruff>=0.6"
      - run: ruff check app ops worker.py benchmark qa tests
      - run: python -m compileall -q app ops worker.py

  test-sqlite:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with: { path: models/*.onnx, key: "models-${{ hashFiles('app/detection.py') }}" }
      - run: python ops/fetch_models.py
      - run: python -m pytest -q -p no:cacheprovider
        env: { PYTHONPATH: ".:tests", CC_REQUIRE_MODELS: "1" }

  test-postgres:
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: pip install -r requirements-dev.txt
      - uses: actions/cache@v4
        with: { path: models/*.onnx, key: "models-${{ hashFiles('app/detection.py') }}" }
      - run: python ops/fetch_models.py
      - run: python -m pytest -q -p no:cacheprovider
        env:
          PYTHONPATH: ".:tests"
          CC_REQUIRE_MODELS: "1"
          CC_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  security:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12', cache: pip }
      - run: pip install "pip-audit>=2.7"
      - run: pip-audit -r requirements.txt
      - run: python qa/secret_scan.py

  web:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { VERCEL: '1', NEXT_TELEMETRY_DISABLED: '1' }

  image:
    needs: [test-sqlite, test-postgres, security, web]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f Dockerfile.vercel -t visuara:ci .
      - name: smoke test (liveness, ffmpeg)
        run: |
          docker run -d --name api -p 8000:80 -e CC_ENV=development -e CC_SIGNING_KEY=ci-only-signing-key-0123456789abcdef visuara:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/health/live && break; sleep 2; done
          curl -fsS http://127.0.0.1:8000/api/health/live
          docker exec api ffprobe -version > /dev/null
          curl -fsS http://127.0.0.1:8000/api/health | python3 -c "import json,sys; d=json.load(sys.stdin)['object_detection']; assert d['installed'], d; print('detection model', d)"
          docker rm -f api
      # D-QA-06: the image's OS packages and Python libraries, failing on CRITICAL or HIGH vulnerabilities that have a fix
      - name: container vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: visuara:ci
          vuln-type: os,library
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
