# Local stand-ins for development and qa/vercel_rehearsal.py: PostgreSQL for Neon, Mailpit for email (inbox at http://localhost:8025).
#   docker compose up -d
# These development credentials are for this local stack only.
services:
  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: cc, POSTGRES_PASSWORD: cc-local-only, POSTGRES_DB: context_commerce }
    volumes: [ "pg-data:/var/lib/postgresql/data" ]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U cc -d postgres"], interval: 3s, timeout: 3s, retries: 30 }
    ports: [ "127.0.0.1:5433:5432" ]
  mailpit:
    image: axllent/mailpit:latest
    ports: [ "127.0.0.1:8025:8025" ]

volumes:
  pg-data:
