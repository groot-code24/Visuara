# Production backend on one Linux host (VM): API + render workers. Database = Neon, storage = Cloudflare R2,
# both configured in deploy/.env (copy deploy/env.production.example). TLS terminates at Caddy or a Cloudflare Tunnel.
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
x-backend: &backend
  build: ..
  image: context-commerce:${CC_IMAGE_TAG:-latest}
  env_file: [ .env ]
  environment:
    CC_ENV: production
    CC_DATA_DIR: /data
    CC_INLINE_WORKER: "0"
    CC_SECURE_COOKIES: "1"
    CC_LOG_FORMAT: json
  volumes: [ "cc-data:/data" ]
  restart: unless-stopped
  stop_grace_period: 40s
  logging: { driver: json-file, options: { max-size: "20m", max-file: "5" } }

services:
  api:
    <<: *backend
    ports: [ "127.0.0.1:8000:8000" ]          # only the reverse proxy / tunnel reaches it
    mem_limit: 1g
    cpus: 1.0
  worker:
    <<: *backend
    command: ["python", "worker.py"]
    mem_limit: ${CC_WORKER_MEM_LIMIT:-3g}
    cpus: ${CC_WORKER_CPUS:-2.0}
    deploy: { replicas: ${CC_WORKER_REPLICAS:-1} }
    healthcheck: { test: ["CMD", "python", "-m", "ops.worker_health"], interval: 60s, timeout: 5s, retries: 3 }
  caddy:          # automatic HTTPS for api.<your-domain>; omit if you use the Cloudflare Tunnel profile instead
    image: caddy:2-alpine
    profiles: ["caddy"]
    ports: [ "80:80", "443:443" ]
    volumes: [ "./Caddyfile:/etc/caddy/Caddyfile:ro", "caddy-data:/data" ]
    environment: { CC_API_DOMAIN: "${CC_API_DOMAIN}" }
    restart: unless-stopped
  cloudflared:    # alternative to Caddy: no open inbound ports
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment: { TUNNEL_TOKEN: "${CLOUDFLARE_TUNNEL_TOKEN}" }
    restart: unless-stopped

volumes:
  cc-data:
  caddy-data:
