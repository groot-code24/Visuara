# Override for testing the production domain layout locally: the frontend (Vercel build, served by
# qa/vercel_emulator.py) on http://app.cc.localhost:3000 and the API on http://api.cc.localhost:8000.
# Both are subdomains of cc.localhost, so they are the same "site" (like app.example.com + api.example.com):
# SameSite=Lax session cookies flow on credentialed CORS requests, exactly as in production.
#   docker compose -f docker-compose.yml -f deploy/local/compose.split-origin.yml up -d
x-split: &split
  CC_PUBLIC_URL: http://api.cc.localhost:8000
  CC_APP_URL: http://app.cc.localhost:3000
  CC_CORS_ORIGINS: http://app.cc.localhost:3000
  GOOGLE_CLIENT_ID: qa-client.apps.googleusercontent.com
  GOOGLE_CLIENT_SECRET: qa-not-a-real-secret
services:
  api:
    environment: *split
  worker:
    environment: *split
