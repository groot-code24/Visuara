# Load-test override for qa/load_10_orgs.py: every simulated user comes from one IP (the test machine), so the per-IP
# sign-in limit is raised; workspaces start on the Team plan (the Free plan has one seat); presigned URLs use 127.0.0.1
# (on Windows "localhost" tries IPv6 first and adds about 2 s per new connection, measured in V10).
services:
  api:
    environment:
      CC_AUTH_RATE_PER_MINUTE: "1000"
      CC_SIGNIN_EMAILS_PER_IP_HOUR: "1000"
      CC_DEFAULT_PLAN: team
      CC_S3_PUBLIC_ENDPOINT_URL: http://127.0.0.1:8333
  worker:
    environment:
      CC_DEFAULT_PLAN: team
